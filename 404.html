<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Chain is now Dwindle</title>
    <link rel="canonical" href="https://dwindledaily.com/" />
    <script>
      // Chain was renamed Dwindle. Forward to the new address, keeping any ?date= test
      // link or #hash.
      location.replace('https://dwindledaily.com/' + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://dwindledaily.com/" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f5; --text: #1d1d1f; --accent: #0f6b45; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121214; --text: #f1f1f3; --accent: #6fdcaa; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        box-sizing: border-box; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      a { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <p>Chain is now <strong>Dwindle</strong>.<br />
      <a href="https://dwindledaily.com/">Go to Dwindle</a></p>
  </body>
</html>
